<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Chunithm Datebase</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; table-layout: fixed;}
    th, td { border: 1px solid #ccc; padding: 5px; text-align: left; }
    th { background-color: #f2f2f2; }
    input {
      width: 95%;
      padding: 3px;
      box-sizing: border-box;
    }
    tr.hide { display: none; }
  </style>
</head>
<body>
  <h2>Chunithm楽曲一覧</h2>
  <table id="sheetTable" border="1"></table>

  <script>
    const url = "https://opensheet.elk.sh/1Z-s2QMTFPUjsC7jmrATpDrqRJpAkH6iyFjur3Dzm1iw/Sheet1";

    fetch(url)
      .then(res => res.json())
      .then(data => {
        const headers = Object.keys(data[0]);
        const table = document.getElementById("sheetTable");

        // --- ヘッダー行 ---
        const headerRow = document.createElement("tr");
        headers.forEach(h => {
          const th = document.createElement("th");
          th.textContent = h;
          headerRow.appendChild(th);
        });
        table.appendChild(headerRow);

        // --- 検索入力行 ---
        const searchRow = document.createElement("tr");
        headers.forEach(h => {
          const th = document.createElement("th");
          const input = document.createElement("input");
          input.placeholder = "絞り込み";
          input.dataset.key = h;
          th.appendChild(input);
          searchRow.appendChild(th);
        });
        table.appendChild(searchRow);

        // --- データ行 ---
        data.forEach(row => {
          const tr = document.createElement("tr");
          headers.forEach(h => {
            const td = document.createElement("td");
            td.textContent = row[h];
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });

        // --- 検索イベント ---
        const inputs = table.querySelectorAll("input");
        inputs.forEach(input => {
          input.addEventListener("input", () => {
            const filters = {};
            inputs.forEach(i => {
              if (i.value) filters[i.dataset.key] = i.value.toLowerCase();
            });

            const rows = table.querySelectorAll("tr:not(:nth-child(-n+2))"); // データ行のみ
            rows.forEach(row => {
              const cells = row.querySelectorAll("td");
              const rowData = {};
              headers.forEach((h, i) => rowData[h] = cells[i].textContent.toLowerCase());

              // すべての条件に一致すれば表示
              const match = Object.keys(filters).every(key => 
                rowData[key].includes(filters[key])
              );
              row.classList.toggle("hide", !match);
            });
          });
        });
      })
      .catch(err => console.error("データ取得エラー:", err));
  </script>
</body>
</html>
